# Reusable Tests
#
# Adapted from quickstart-openshift. The template's integration tests (common/tests, written against
# its NestJS API) and its Playwright suite went with the template code. SCS's own E2E suite
# (frontend/e2e) drives a seeded Oracle with mock auth and cannot run against a deployed zone (see
# frontend/e2e/README.md), so this runs a smoke test against the deployment instead: the SPA through
# the route, and an anonymous API call through Caddy's /api proxy to the backend.
name: Reusable Tests

on:
  workflow_call:
    inputs:
      ### Required
      target:
        description: PR number, test or prod
        default: ${{ github.event.number }}
        type: string

permissions: {}

jobs:
  smoke-tests:
    name: Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: https://${{ github.event.repository.name }}-${{ inputs.target }}.apps.gold.devops.gov.bc.ca
    steps:
      # /api/system-status is permitted anonymously (SecurityConfig) so the SPA can show the
      # "temporarily disabled" page; a 200 proves route -> Caddy -> backend.
      - name: Wait for the API through the frontend proxy
        run: |
          for i in {1..30}; do
            status=$(curl --connect-timeout 5 --max-time 10 -s -o /dev/null -w "%{http_code}" "${BASE_URL}/api/system-status" || true)
            if [ "$status" = "200" ]; then
              echo "API reachable through the frontend."
              exit 0
            fi
            echo "Waiting for ${BASE_URL}/api/system-status (HTTP $status), retrying in 10s... ($i/30)"
            sleep 10
          done
          echo "ERROR: API did not become reachable in time."
          exit 1

      - name: SPA and runtime config are served
        run: |
          set -euo pipefail
          curl -fsS "${BASE_URL}/" | grep -q '<div id="root">'
          # Deep link: Caddy must fall back to index.html for client-side routes.
          curl -fsS "${BASE_URL}/scalers" | grep -q '<div id="root">'
          # Generated at container start by frontend/docker-entrypoint.sh.
          curl -fsS "${BASE_URL}/amplify-config.js" | grep -q 'window.amplifyConfig'
          echo "Frontend OK."
