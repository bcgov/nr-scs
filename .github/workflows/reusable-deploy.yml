# Reusable Deploy
#
# Adapted from quickstart-openshift: no init or database jobs, because SCS uses the existing shared
# Oracle (TCPS) rather than a per-zone Postgres. Backend then frontend, each its own Template.
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      database_host:
        description: Oracle host
        required: true
      database_service_name:
        description: Oracle service name
        required: true
      database_user:
        description: Oracle user
        required: true
      database_password:
        description: Oracle password
        required: true
      keystore_secret:
        description: Passphrase for the Oracle TCPS trust store
        required: true
      jasper_server_username:
        description: JasperReports Server user
        required: false
      jasper_server_password:
        description: JasperReports Server password
        required: false
      ches_client_id:
        description: CHES client id
        required: false
      ches_client_secret:
        description: CHES client secret
        required: false
    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.frontend.outputs.triggered }}

permissions: {}

jobs:
  backend:
    name: Deploy (backend)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    # Sensitive values go through env vars and are referenced as "$VAR" in `parameters`, not
    # expanded inline: the deployer runs `oc process ... <parameters>` in bash, so an inline secret
    # containing `$X` would be re-expanded and silently mangled.
    env:
      DATABASE_USER: ${{ secrets.database_user }}
      DATABASE_PASSWORD: ${{ secrets.database_password }}
      KEYSTORE_SECRET: ${{ secrets.keystore_secret }}
      JASPER_SERVER_USERNAME: ${{ secrets.jasper_server_username }}
      JASPER_SERVER_PASSWORD: ${{ secrets.jasper_server_password }}
      CHES_CLIENT_ID: ${{ secrets.ches_client_id }}
      CHES_CLIENT_SECRET: ${{ secrets.ches_client_secret }}
    steps:
      - uses: bcgov/action-deployer-openshift@bb9d143f4f03187239580c17c4b77da04cdb6e66 # v4.2.2
        id: deploy
        with:
          file: backend/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Off on purpose: debug logs the processed Template, including the Secret's stringData.
          debug: false
          overwrite: true
          # JWT_ISSUER_JWKS_URI is derived from the Cognito pool, and JWT_AUDIENCE is the same
          # variable the frontend uses as its client id, so the two sides cannot drift apart.
          # Keep comments out of the multi-line `parameters` scalar: a '#' line ends it.
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p APP_ENVIRONMENT="${{ inputs.target == 'prod' && 'PROD' || inputs.target == 'test' && 'TEST' || 'DELIVERY' }}"
            -p DATABASE_HOST="${{ secrets.database_host }}"
            -p DATABASE_SERVICE_NAME="${{ secrets.database_service_name }}"
            -p DATABASE_USER="$DATABASE_USER"
            -p DATABASE_PASSWORD="$DATABASE_PASSWORD"
            -p KEYSTORE_SECRET="$KEYSTORE_SECRET"
            -p JWT_ISSUER_JWKS_URI="${{ vars.COGNITO_USER_POOL_ID != '' && format('https://cognito-idp.{0}.amazonaws.com/{1}/.well-known/jwks.json', vars.COGNITO_REGION || 'ca-central-1', vars.COGNITO_USER_POOL_ID) || '' }}"
            -p JWT_AUDIENCE="${{ vars.COGNITO_USER_POOL_CLIENT_ID }}"
            -p JASPER_SERVER_LOGIN_URL="${{ vars.JASPER_SERVER_LOGIN_URL }}"
            -p JASPER_SERVER_FETCH_URL="${{ vars.JASPER_SERVER_FETCH_URL }}"
            -p JASPER_SERVER_USERNAME="$JASPER_SERVER_USERNAME"
            -p JASPER_SERVER_PASSWORD="$JASPER_SERVER_PASSWORD"
            -p MAIL_ENABLED="${{ vars.MAIL_ENABLED || 'false' }}"
            -p CHES_EMAIL_URL="${{ vars.CHES_EMAIL_URL }}"
            -p CHES_TOKEN_URL="${{ vars.CHES_TOKEN_URL }}"
            -p CHES_FROM_EMAIL="${{ vars.CHES_FROM_EMAIL }}"
            -p CHES_CLIENT_ID="$CHES_CLIENT_ID"
            -p CHES_CLIENT_SECRET="$CHES_CLIENT_SECRET"
          triggers: ${{ inputs.triggers }}

  frontend:
    name: Deploy (frontend)
    environment: ${{ inputs.environment }}
    needs: [backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@bb9d143f4f03187239580c17c4b77da04cdb6e66 # v4.2.2
        id: deploy
        with:
          file: frontend/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p APP_ENV="${{ inputs.target == 'prod' && 'prod' || inputs.target == 'test' && 'test' || 'dev' }}"
            -p COGNITO_REGION="${{ vars.COGNITO_REGION || 'ca-central-1' }}"
            -p COGNITO_USER_POOL_ID="${{ vars.COGNITO_USER_POOL_ID }}"
            -p COGNITO_USER_POOL_CLIENT_ID="${{ vars.COGNITO_USER_POOL_CLIENT_ID }}"
            -p COGNITO_OAUTH_DOMAIN="${{ vars.COGNITO_OAUTH_DOMAIN }}"
          triggers: ${{ inputs.triggers }}
