post:
  tags:
    - Scaler
  summary: Create a scaler record
  description: |
    Create a new scaler record in the SCS system.
    Based on `scs_scaler_pkg.create_rec`.

    The create operation performs the following writes in sequence:
    1. Inserts the core scaler row (`scs_scaler_pkg`) — returns the generated `scalerLicenceNo`.
    2. Inserts one or two assigned licence type rows (`SCS_SCALER_ASSIGND_LIC_TYP_PKG`) for each entry in `licenceTypes`.
    3. If `SCS` is in `licenceTypes`, inserts **either** an appointment (`SCS_SCALER_LICENCE_ATTRIBT_PKG`) **or** an exam (`scs_scaler_training_pkg`) — not both.

    Business rules enforced server-side:
    * `clientNumber` must exist in the BC Forests client registry (location `00`).
    * Exactly one of `appointment` or `exam` must be provided when `SCS` is in `licenceTypes`.
    * `expiryDate` is required when `WA` is in `licenceTypes`.
    * `expiryDate` must be after `issuedDate` when both are provided.

    Notes:
    * `scalerAppointmentType`, `scaleGradingSystemCode` (appointment), and `scalerTrainingClassCode`
      (exam) are derived from LOV entries and must be resolved by the client before posting
      (see `GET /grading-code-appointment-type-lov` and `GET /scaler-training-type-lov`).
  operationId: createScaler
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScalerCreate'
        example:
          clientNumber: "12345678"
          orgUnitNo: 1234
          issuedDate: "2025-01-15"
          expiryDate: null
          oathTakenInd: "Y"
          licenceTypes: ["SCS"]
          appointment:
            scalerAppointmentType: "FORS"
            scaleGradingSystemCode: "BC"
            provinceWideInd: "Y"
            issuedDate: "2025-01-15"
            expiryDate: null
  responses:
    '201':
      description: Scaler created successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScalerDetail'
          example:
            scalerLicenceNo: "1234"
            clientNumber: "12345678"
            orgUnitNo: 1234
            issuedDate: "2025-01-15"
            expiryDate: null
            oathTakenInd: "Y"
            licenceCancelledDate: null
            licenceTypes: ["SCS"]
            appointment:
              scalerLicenceAttributeId: 5001
              scalerLicenceNo: "1234"
              scalerAppointmentType: "FORS"
              scaleGradingSystemCode: "BC"
              provinceWideInd: "Y"
              issuedDate: "2025-01-15"
              expiryDate: null
            exam: null
            entryTimestamp: "2025-01-15T10:30:00Z"
            entryUserid: "JSMITH"
            updateTimestamp: "2025-01-15T10:30:00Z"
            updateUserid: "JSMITH"
            revisionCount: 1
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "VALIDATION_ERROR"
            message: "clientNumber is required"
    '409':
      description: Conflict — scaler licence number already exists
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "DUPLICATE_KEY"
            message: "Scaler licence number already exists"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"
