parameters:
  - name: scalerLicenceNo
    in: path
    description: Scaler licence number
    required: true
    schema:
      type: string
      maxLength: 4
      example: "1234"
  - name: scalerPerformanceRemarkId
    in: path
    description: Performance-remark record identifier (legacy "Issue #").
    required: true
    schema:
      type: integer
      format: int64
      example: 1001

put:
  tags:
    - ScalerPerformanceRemark
  summary: Update a performance remark for a scaler
  description: |
    Update an existing performance-remark record for a scaler. This matches the legacy scaler
    Performance Remarks tab edit flow (`scalerPerformanceRemarkUpdate.jsp` /
    `ScalerPerformanceRemarkUpdateAction`). Based on `scs_scaler_performanc_rmrk_pkg.update_rec`.

    The record is identified by `scalerPerformanceRemarkId` in the path; it must exist and belong
    to the scaler in the path (otherwise `404`). "Issue #" is not editable — only the create-time
    fields may change.

    Business rules enforced server-side (mirroring `ScalerPerformanceRemarkBo.validate`):
    * `loggedTimestamp` (Date of Incident) is required and cannot be in the future.
    * Exactly one of `scalerPerformanceActnCode` or `scalerPerformanceOutcmCode` must be supplied.
    * `suspendStartDate` must be on or before `suspendEndDate` when both are supplied.
    * `checkScaleId`, when supplied, must reference an existing check scale.
  operationId: updateScalerPerformanceRemark
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScalerPerformanceRemarkUpdateRequest'
        example:
          loggedTimestamp: "2025-01-10"
          scalerPerformanceActnCode: "W"
          performanceRemarkDesc: "Late submission of scale data"
          checkScaleId: 55001
  responses:
    '200':
      description: Performance remark updated successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScalerPerformanceRemarkDetail'
          example:
            scalerPerformanceRemarkId: 1001
            scalerLicenceNo: "1234"
            loggedTimestamp: "2025-01-10"
            performanceRemarkDesc: "Late submission of scale data"
            scalerPerformanceActnCode: "W"
            scalerPerformanceActnDescription: "Warning"
            checkScaleId: 55001
            entryTimestamp: "2025-01-10T10:30:00Z"
            entryUserid: "JSMITH"
            updateTimestamp: "2026-07-08T10:30:00Z"
            updateUserid: "BJONES"
            revisionCount: 2
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "VALIDATION_ERROR"
            message: "Either an action or an outcome must be selected, but not both."
    '404':
      description: Scaler or performance remark not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "No performance remark found with id 1001 for scaler 1234"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"

delete:
  tags:
    - ScalerPerformanceRemark
  summary: Delete a performance remark for a scaler
  description: |
    Delete a performance-remark record from a scaler. This matches the legacy scaler Performance
    Remarks tab delete flow (`scalerPerformanceRemarkSummary.jsp` /
    `ScalerPerformanceRemarkDeleteAction`). Based on `scs_scaler_performanc_rmrk_pkg.delete_rec`.

    The record is identified by `scalerPerformanceRemarkId` in the path; it must exist and belong
    to the scaler in the path (otherwise `404`).
  operationId: deleteScalerPerformanceRemark
  responses:
    '204':
      description: Performance remark deleted successfully
    '404':
      description: Scaler or performance remark not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "No performance remark found with id 1001 for scaler 1234"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"
