parameters:
  - name: scalerLicenceNo
    in: path
    description: Scaler licence number
    required: true
    schema:
      type: string
      maxLength: 4
      example: "1234"

get:
  tags:
    - ScalerAppointment
  summary: Get appointments for a scaler
  description: |
    Retrieve the full list of appointment (licence attribute) records for a scaler.
    This backs the legacy Appointments tab on the scaler view page.
    Based on `SCS_SCALER_LICENCE_ATTRIBT_PKG.search_recs`.
  operationId: getScalerAppointments
  responses:
    '200':
      description: Appointment list found
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../root.yaml#/components/schemas/ScalerAppointmentDetail'
          example:
            - scalerLicenceAttributeId: 5001
              scalerLicenceNo: "1234"
              scalerAppointmentType: "O"
              scaleGradingSystemCode: "BC"
              orgUnitNo: null
              provinceWideInd: "Y"
              issuedDate: "2025-01-15"
              expiryDate: "2030-01-15"
              cancellationDate: null
              cancellationReasonTxt: null
            - scalerLicenceAttributeId: 5002
              scalerLicenceNo: "1234"
              scalerAppointmentType: "A"
              scaleGradingSystemCode: "BC"
              orgUnitNo: 1234
              provinceWideInd: "N"
              issuedDate: "2024-01-15"
              expiryDate: "2025-01-15"
              cancellationDate: "2024-10-01"
              cancellationReasonTxt: "Transferred to new district"
    '404':
      description: Scaler not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "No scaler found with licence number 1234"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"

post:
  tags:
    - ScalerAppointment
  summary: Create an appointment for a scaler
  description: |
    Create a new appointment (licence attribute) record for an existing scaler.
    This matches the legacy scaler Appointments tab create flow.
    Based on `SCS_SCALER_LICENCE_ATTRIBT_PKG.insert_rec`.

    Business rules enforced server-side:
    * `scalerAppointmentType` and `scaleGradingSystemCode` must come from the selected
      `GET /grading-code-appointment-type-lov` row.
    * `orgUnitNo` is required when `provinceWideInd` is `N`.
    * `orgUnitNo` must be omitted when `provinceWideInd` is `Y`.
    * `expiryDate` must be on or after `issuedDate` when provided.
    * Maximum appointment length depends on `scalerAppointmentType` (legacy rules:
      `A` = 1 year, `L` = 2 years, `O` = 5 years).
  operationId: createScalerAppointment
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScalerAppointmentCreateRequest'
        example:
          scalerAppointmentType: "O"
          scaleGradingSystemCode: "BC"
          orgUnitNo: null
          provinceWideInd: "Y"
          issuedDate: "2025-01-15"
          expiryDate: "2030-01-15"
  responses:
    '201':
      description: Appointment created successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScalerAppointmentDetail'
          example:
            scalerLicenceAttributeId: 5001
            scalerLicenceNo: "1234"
            scalerAppointmentType: "O"
            scaleGradingSystemCode: "BC"
            orgUnitNo: null
            provinceWideInd: "Y"
            issuedDate: "2025-01-15"
            expiryDate: "2030-01-15"
            cancellationDate: null
            cancellationReasonTxt: null
            entryTimestamp: "2026-03-17T10:30:00Z"
            entryUserid: "JSMITH"
            updateTimestamp: "2026-03-17T10:30:00Z"
            updateUserid: "JSMITH"
            revisionCount: 1
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "VALIDATION_ERROR"
            message: "orgUnitNo is required when provinceWideInd is N"
    '404':
      description: Scaler not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "No scaler found with licence number 1234"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"

