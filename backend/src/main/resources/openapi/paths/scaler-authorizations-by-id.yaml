get:
  tags:
    - ScalerAuthorization
  summary: Get scaler authorization
  description: Get a scaler authorization record by id.
  operationId: getScalerAuthorization
  parameters:
    - in: path
      name: scalerAuthorizationId
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Scaler authorization found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScalerAuthorizationDetail'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
put:
  tags:
    - ScalerAuthorization
  summary: Update scaler authorization
  description: Update an existing scaler authorization record.
  operationId: updateScalerAuthorization
  parameters:
    - in: path
      name: scalerAuthorizationId
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScalerAuthorizationSaveRequest'
  responses:
    '200':
      description: Scaler authorization updated successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScalerAuthorizationDetail'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
delete:
  tags:
    - ScalerAuthorization
  summary: Delete scaler authorization
  description: Delete a scaler authorization record by id.
  operationId: deleteScalerAuthorization
  parameters:
    - in: path
      name: scalerAuthorizationId
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: Scaler authorization deleted successfully
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
