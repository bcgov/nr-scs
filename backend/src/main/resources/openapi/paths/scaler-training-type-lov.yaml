get:
  tags:
    - Lov
  summary: Get scaler training type LOV rows
  description: |
    Retrieve the rich training type LOV rows used by the legacy scaler create flow.
    Based on `scs_scty_lov_vw_pkg.search_recs`.
  operationId: getScalerTrainingTypeLov
  responses:
    '200':
      description: Successful search operation
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../root.yaml#/components/schemas/ScalerTrainingTypeLov'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'

