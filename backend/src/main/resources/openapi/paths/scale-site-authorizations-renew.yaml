post:
  tags:
    - Workbench
  summary: Renew scale site authorization
  description: |
    Renews a scale site authorization using `scs_scale_workbench_pkg.renew_scale_site_auth`.
  operationId: renewScaleSiteAuthorization
  parameters:
    - name: authorizationId
      in: path
      description: Scale site authorization identifier to renew
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    '200':
      description: Renewal completed
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/AuthorizationRenewResult'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
