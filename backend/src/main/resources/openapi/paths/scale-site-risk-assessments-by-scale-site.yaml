parameters:
  - name: scaleSiteIdNmbr
    in: path
    description: Scale site identifier
    required: true
    schema:
      type: string
      maxLength: 4
      example: "123"

post:
  tags:
    - ScaleSiteRiskAssessment
  summary: Create a risk assessment for a scale site
  description: |
    Create a new scale site risk assessment. Mirrors the legacy scale site risk assessment create
    flow (`RiskAssessmentAction.addScaleSiteAssessment` + `saveScaleSiteAssessment`): the new
    `RISK_QUESTIONNAIRE` row is bound to the currently active `SCSI` template and linked to the
    scale site via `scale_site_id_nmbr`, and the supplied answers are written as
    `RISK_QUESTION_RESPONSE` rows in the same transaction. The risk rating total / level are derived
    by the database views from the saved responses.

    Business rules enforced server-side:
    * Exactly one `SCSI` template must be active; otherwise the request is rejected.
    * Every question in the active template must be answered (a full save, matching legacy
      `validateAllQuestionResponsesAnswered`).
    * Each `answerId` must be a valid answer for its `questionId` in the bound template.
    * `comments` are optional and length-limited (4000 characters).
  operationId: createScaleSiteRiskAssessment
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/RiskAssessmentSaveRequest'
        example:
          comments: "Initial assessment on site designation."
          responses:
            - questionId: 101
              answerId: 5001
            - questionId: 102
              answerId: 5010
  responses:
    '201':
      description: Risk assessment created successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScaleSiteRiskAssessmentDetail'
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "BAD_REQUEST"
            message: "All questions must be answered in order to save the assessment."
    '404':
      description: Scale site not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "No scale site tombstone found for scale site id 123"
    '409':
      description: Template configuration error (no single active SCSI template)
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "CONFLICT"
            message: "Multiple active risk assessment templates found for type SCSI."
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"
