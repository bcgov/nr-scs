post:
  tags:
    - Workbench
  summary: Renew mark site designation
  description: |
    Renews a mark site designation using `scs_scale_workbench_pkg.renew_hauling_mark_auth`.
  operationId: renewMarkSiteDesignation
  parameters:
    - name: authorizationId
      in: path
      description: Mark site designation identifier to renew
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    '200':
      description: Renewal completed
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/AuthorizationRenewResult'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
