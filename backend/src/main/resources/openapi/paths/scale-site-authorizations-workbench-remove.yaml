post:
  tags:
    - ScaleSiteAuthorization
  summary: Remove scale site authorization from workbench
  description: |
    Removes a scale site authorization from the workbench list by setting the expiry notification indicator.
  operationId: removeScaleSiteAuthorizationFromWorkbench
  parameters:
    - name: authorizationId
      in: path
      description: Scale site authorization identifier to remove
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    '204':
      description: Removed from workbench
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
