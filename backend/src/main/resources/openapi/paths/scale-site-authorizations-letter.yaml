post:
  tags:
    - ScaleSiteAuthorization
  summary: Create scale site authorization letter
  description: Generate the scale site authorization letter report (legacy R006).
  operationId: createScaleSiteAuthorizationLetter
  parameters:
    - in: path
      name: scaleSiteAuthorizationId
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScaleSiteAuthorizationLetterReportRequest'
  responses:
    '200':
      description: Letter generated successfully
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.ms-excel:
          schema:
            type: string
            format: binary
    '202':
      description: Letter request accepted
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ReportAckResponse'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
get:
  tags:
    - ScaleSiteAuthorization
  summary: View scale site authorization letter
  description: Download the scale site authorization letter report (legacy R006).
  operationId: getScaleSiteAuthorizationLetter
  parameters:
    - in: path
      name: scaleSiteAuthorizationId
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Letter downloaded successfully
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
