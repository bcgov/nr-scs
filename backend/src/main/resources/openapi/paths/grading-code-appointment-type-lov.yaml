get:
  tags:
    - Lov
  summary: Get grading-code appointment type LOV rows
  description: |
    Retrieve the rich appointment LOV rows used by the legacy scaler create flow.
    Based on `scs_sgcd_sapt_lov_vw_pkg.search_recs`.
  operationId: getGradingCodeAppointmentTypeLov
  responses:
    '200':
      description: Successful search operation
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../root.yaml#/components/schemas/GradingCodeAppointmentTypeLov'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'

