parameters:
  - name: scalerLicenceNo
    in: path
    description: Scaler licence number
    required: true
    schema:
      type: string
      maxLength: 4
      example: "1234"

get:
  tags:
    - ScalerExam
  summary: Get exams / upgrades for a scaler
  description: |
    Retrieve the full list of exam / upgrade (training) records for a scaler.
    This backs the legacy Exams/Upgrades tab on the scaler view page.
    Based on `scs_scaler_training_pkg.search_recs`.
  operationId: getScalerExams
  responses:
    '200':
      description: Exam / upgrade list found
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../root.yaml#/components/schemas/ScalerExamDetail'
          example:
            - scalerLicenceNo: "1234"
              scalerTrainingTypeId: "SCEX"
              scalerTrainingClassCode: "SC"
              completionDate: "2025-01-10"
              entryTimestamp: "2025-01-10T10:30:00Z"
              entryUserid: "JSMITH"
              updateTimestamp: "2025-01-10T10:30:00Z"
              updateUserid: "JSMITH"
              revisionCount: 1
    '404':
      description: Scaler not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "No scaler found with licence number 1234"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"

post:
  tags:
    - ScalerExam
  summary: Create an exam / upgrade for a scaler
  description: |
    Create a new exam / upgrade (training) record for an existing scaler.
    This matches the legacy scaler Exams/Upgrades tab create flow.
    Based on `scs_scaler_training_pkg.insert_rec`.

    Business rules enforced server-side:
    * `scalerTrainingTypeId` must come from the selected exam type LOV
      (`GET /scaler-training-type-lov`).
    * `scalerTrainingClassCode` is derived server-side from the selected training
      type LOV entry; any client-supplied value is ignored.
  operationId: createScalerExam
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScalerExamRequest'
        example:
          scalerTrainingTypeId: "SCEX"
          completionDate: "2025-01-10"
  responses:
    '201':
      description: Exam / upgrade created successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScalerExamDetail'
          example:
            scalerLicenceNo: "1234"
            scalerTrainingTypeId: "SCEX"
            scalerTrainingClassCode: "SC"
            completionDate: "2025-01-10"
            entryTimestamp: "2026-03-17T10:30:00Z"
            entryUserid: "JSMITH"
            updateTimestamp: "2026-03-17T10:30:00Z"
            updateUserid: "JSMITH"
            revisionCount: 1
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "VALIDATION_ERROR"
            message: "scalerTrainingTypeId is required"
    '404':
      description: Scaler not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "No scaler found with licence number 1234"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
          example:
            code: "ORA-12345"
            message: "Database connection error"
