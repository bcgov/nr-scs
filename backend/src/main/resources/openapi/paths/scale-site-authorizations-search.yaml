get:
  tags:
    - Workbench
  summary: Search expiring scale site authorizations
  description: |
    Search expiring scale site authorizations using criteria based on
    `scs_scale_site_auth_wb_vw_pkg.search_recs`.
  operationId: searchScaleSiteAuthorizations
  parameters:
    - name: scaleSiteAuthorizationId
      in: query
      description: Scale site authorization identifier
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    - name: effectiveDate
      in: query
      description: Effective date (exact match)
      required: false
      schema:
        type: string
        format: date
    - name: expiryDate
      in: query
      description: Expiry date (exact match)
      required: false
      schema:
        type: string
        format: date
    - name: scaleSiteNumber
      in: query
      description: Scale site number
      required: false
      schema:
        type: string
    - name: scaleSiteName
      in: query
      description: Scale site name
      required: false
      schema:
        type: string
    - name: regionId
      in: query
      description: Region identifier
      required: false
      schema:
        type: integer
        format: int64
    - name: districtId
      in: query
      description: District identifier
      required: false
      schema:
        type: integer
        format: int64
    - name: primarySort
      in: query
      description: Primary sort field (1-7)
      required: false
      schema:
        type: integer
        default: 1
    - name: secondarySort
      in: query
      description: Secondary sort field (0-7)
      required: false
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: Successful search operation
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../root.yaml#/components/schemas/ScaleSiteAuthorizationWorkbenchResult'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
