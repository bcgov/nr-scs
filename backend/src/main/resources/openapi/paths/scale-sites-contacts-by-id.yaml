parameters:
  - name: scaleSiteIdNmbr
    in: path
    required: true
    description: Scale site identifier
    schema:
      type: string
      maxLength: 4
      example: "1234"
  - name: clientContactId
    in: path
    required: true
    description: Client contact identifier
    schema:
      type: integer
      format: int64

get:
  tags:
    - ScaleSiteContact
  summary: Get a single scale site contact
  description: |
    Returns a single scale site contact including effective and expiry dates,
    which are not available from the contacts list view.
    Based on scs_scale_site_contact_pkg.select_rec.
  operationId: getScaleSiteContact
  responses:
    '200':
      description: Contact found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScaleSiteContact'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'

put:
  tags:
    - ScaleSiteContact
  summary: Update a scale site contact
  description: |
    Updates an existing scale site contact association.
    Business rules:
    * The contact must already be associated with the scale site.
    * Only one primary contact (primaryContactInd = Y) is allowed per scale site.
    * expiryDate must be on or after effectiveDate when provided.
    Based on scs_scale_site_contact_pkg.update_rec.
  operationId: updateScaleSiteContact
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScaleSiteContactUpdateRequest'
  responses:
    '200':
      description: Contact updated
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScaleSiteContact'
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '409':
      description: Conflict — changing to primary when one already exists
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'

delete:
  tags:
    - ScaleSiteContact
  summary: Remove a contact from a scale site
  description: |
    Removes a contact association from a scale site.
    Based on scs_scale_site_contact_pkg.delete_rec.
  operationId: deleteScaleSiteContact
  responses:
    '204':
      description: Contact removed
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
