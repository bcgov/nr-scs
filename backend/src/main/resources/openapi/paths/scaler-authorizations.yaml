post:
  tags:
    - ScalerAuthorization
  summary: Create scaler authorization
  description: |
    Create a scaler authorization record.
    Based on `scs_scaler_authorization_pkg.insert_rec`.
  operationId: createScalerAuthorization
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScalerAuthorizationSaveRequest'
  responses:
    '201':
      description: Scaler authorization created successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScalerAuthorizationDetail'
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
