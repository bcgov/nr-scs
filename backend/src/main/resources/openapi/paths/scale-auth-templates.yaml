get:
  operationId: searchScaleAuthTemplates
  summary: Search scale auth templates
  description: |
    Search templates with optional filters. Returns the full template record
    including orgUnitNo and scaleConditionClassCode (richer than the LOV endpoint).
    Based on `scs_scale_auth_template_pkg.search_recs`.
  tags:
    - ScaleAuthTemplate
  parameters:
    - name: scaleConditionClassCode
      in: query
      required: false
      schema:
        type: string
    - name: orgUnitNo
      in: query
      required: false
      schema:
        type: integer
        format: int64
    - name: scaleAuthTemplateName
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../root.yaml#/components/schemas/ScaleAuthTemplate'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'

post:
  operationId: createScaleAuthTemplate
  summary: Create a scale auth template
  description: |
    Create a new template and optionally assign conditions.
    Based on `scs_scale_auth_template_pkg.insert_rec` and
    `scs_scale_template_conditn_pkg.insert_rec`.
  tags:
    - ScaleAuthTemplate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScaleAuthTemplateSaveRequest'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScaleAuthTemplate'
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
