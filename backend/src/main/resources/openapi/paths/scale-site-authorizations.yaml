post:
  tags:
    - ScaleSiteAuthorization
  summary: Create scale site authorization
  description: |
    Create a scale site authorization record.
  operationId: createScaleSiteAuthorization
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScaleSiteAuthorizationSaveRequest'
  responses:
    '201':
      description: Scale site authorization created successfully
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ScaleSiteAuthorizationDetail'
    '400':
      description: Bad request — validation failure
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
