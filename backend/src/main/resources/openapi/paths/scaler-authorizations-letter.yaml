post:
  tags:
    - ScalerAuthorization
  summary: Create scaler authorization letter
  description: Generate the scaler authorization letter report (legacy R003).
  operationId: createScalerAuthorizationLetter
  parameters:
    - in: path
      name: scalerAuthorizationId
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../root.yaml#/components/schemas/ScalerAuthorizationLetterReportRequest'
  responses:
    '200':
      description: Letter generated successfully
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.ms-excel:
          schema:
            type: string
            format: binary
    '202':
      description: Letter request accepted
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/ReportAckResponse'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
get:
  tags:
    - ScalerAuthorization
  summary: View scaler authorization letter
  description: Download the scaler authorization letter report (legacy R003).
  operationId: getScalerAuthorizationLetter
  parameters:
    - in: path
      name: scalerAuthorizationId
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Letter downloaded successfully
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/Error'
