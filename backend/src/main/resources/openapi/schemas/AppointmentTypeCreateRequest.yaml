type: object
description: Payload for creating an appointment type.
properties:
  code:
    type: string
    maxLength: 10
    description: Appointment type code.
  description:
    type: string
    description: >-
      Appointment type description. Maximum 120 characters; the limit is
      enforced by AppointmentTypeService so that over-length input returns the
      specific "Appointment Description can not be greater than 120 characters."
      message rather than a generic bean-validation error.
  actingInd:
    type: string
    description: Acting indicator.
    enum: [Y, N]
  effectiveDate:
    type: string
    format: date
    description: Effective date.
  expiryDate:
    type: string
    format: date
    description: Expiry date.
required:
  - code
  - description
  - actingInd
  - effectiveDate
  - expiryDate
