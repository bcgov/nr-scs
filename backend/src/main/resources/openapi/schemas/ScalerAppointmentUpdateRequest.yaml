type: object
description: |
  Request payload for updating an existing scaler appointment (licence attribute) record
  from the scaler Appointments tab.

  This extends the create payload with cancellation fields used by the legacy edit flow.
required:
  - scalerAppointmentType
  - scaleGradingSystemCode
  - provinceWideInd
  - issuedDate
properties:
  scalerAppointmentType:
    type: string
    maxLength: 4
    description: Appointment type code derived from the selected appointment LOV row
    example: "A"
  scaleGradingSystemCode:
    type: string
    maxLength: 4
    description: Scale grading system code derived from the selected appointment LOV row
    example: "BC"
  orgUnitNo:
    type: integer
    format: int64
    nullable: true
    description: |
      Appointment Reg / Dist org unit number. Required when `provinceWideInd` is `N` and
      must be omitted when `provinceWideInd` is `Y`.
    example: 1234
  provinceWideInd:
    type: string
    enum: [Y, N]
    description: Province-wide indicator
    example: "N"
  issuedDate:
    type: string
    format: date
    description: Appointment effective date
    example: "2025-01-15"
  expiryDate:
    type: string
    format: date
    nullable: true
    description: Appointment expiry date
    example: "2026-01-15"
  cancellationDate:
    type: string
    format: date
    nullable: true
    description: Cancellation date. Must be supplied together with `cancellationReasonTxt`.
    example: "2025-11-01"
  cancellationReasonTxt:
    type: string
    maxLength: 200
    nullable: true
    description: Cancellation reason text. Must be supplied together with `cancellationDate`.
    example: "Appointment superseded"

