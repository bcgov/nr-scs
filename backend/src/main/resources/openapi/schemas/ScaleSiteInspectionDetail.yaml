type: object
description: |
  Aggregated read-only inspection detail used to render the legacy Scale Site inspection view page.

  This schema represents a single inspection-detail resource rather than a direct row from one
  package or view. The payload is assembled from the legacy base inspection report plus supporting
  scale-site, owner, inspected-scaling-method, and question/response data.
properties:
  inspectionId:
    type: integer
    format: int64
    nullable: true
    description: Inspection identifier.
  inspectionTypeCode:
    type: string
    nullable: true
    description: Scale site inspection type code.
  inspectionTypeDescription:
    type: string
    nullable: true
    description: Display description of the inspection type.
  inspectionDate:
    type: string
    format: date
    nullable: true
    description: Inspection date.
  inspector:
    type: string
    nullable: true
    description: Inspector identifier displayed on the legacy view page.
  scaleSiteIdNmbr:
    type: string
    nullable: true
    description: Scale site number associated with the inspection.
  siteName:
    type: string
    nullable: true
    description: Scale site name.
  siteLocation:
    type: string
    nullable: true
    description: Scale site location.
  siteOwnerName:
    type: string
    nullable: true
    description: Scale site owner display name.
  siteTypeDisplay:
    type: string
    nullable: true
    description: Comma-separated display value of the inspected scaling methods shown as the site type.
  previousInspectionId:
    type: integer
    format: int64
    nullable: true
    description: Follow-up-to inspection identifier.
  recipient:
    type: string
    nullable: true
    description: Site operator / recipient display value.
  siteOperatorPresentInd:
    type: string
    nullable: true
    description: Legacy yes/no indicator for whether the site operator was present during the inspection.
  siteOperatorPresentDescription:
    type: string
    nullable: true
    description: Display description of `siteOperatorPresentInd`.
  comments:
    type: string
    nullable: true
    description: General comments for the inspection.
  questionResponses:
    type: array
    description: Question response rows displayed in the inspection view.
    items:
      $ref: './ScaleSiteInspectionQuestionResponse.yaml'

