type: object
description: |
  Request body for `PUT /api/summary-check-scales/{checkScaleId}` — the header update of an
  existing summary check scale (legacy `SummaryCheckScaleAction.updateSummaryCheckScale`,
  `updateSummaryCheckScale.jsp`). Header-only: the SPG roll-up rows are managed through the
  dedicated SPG add/delete endpoints, so this body carries no `spgRows`. `returnType` is locked
  once the record has SPG rows (it always does) — it must map to the stored `cksc_type`; the
  server rejects a changed return type. `partial_ind` is forced `Y` for LT/SLT (user-supplied for
  SFP). The header `originalScaleNetValue` / `checkScaleNetValue` stay null and are derived from
  the SPG rows.
required:
  - returnType
  - checkScaleTypeCode
  - originalScalerLicenceNo
  - checkScalerLicenceNo
  - timberMark
  - scaleSiteIdNmbr
  - followedGoodPracticeInd
  - originalWithinStandardInd
  - checkReplacesOriginalInd
  - originalScaleDate
  - originalScaleReturnNo
  - chkScaleDate
  - chkScaleReturnNo
properties:
  returnType:
    $ref: '../root.yaml#/components/schemas/ReturnType'
  checkScaleTypeCode:
    type: string
    maxLength: 4
    description: Code from the CHECK_SCALE_TYPE_CODE LOV.
  originalScalerLicenceNo:
    type: string
    maxLength: 4
    description: Licence number of the original scaler (must exist; must differ from check scaler).
  checkScalerLicenceNo:
    type: string
    maxLength: 4
    description: Licence number of the check scaler.
  loadArrivalNumber:
    type: string
    maxLength: 10
    nullable: true
    description: Load arrival number. Either this or weighSlipNumber, not both.
  weighSlipNumber:
    type: integer
    format: int64
    nullable: true
    description: Weigh split/slip number. Either this or loadArrivalNumber, not both.
  timberMark:
    type: string
    maxLength: 6
    description: Timber mark (must exist).
  scaleSiteIdNmbr:
    type: string
    maxLength: 4
    description: Scale site id number (must exist).
  followedGoodPracticeInd:
    type: string
    enum: [Y, N]
    description: Whether the original scaler followed good practices.
  originalWithinStandardInd:
    type: string
    enum: [Y, N]
    description: Whether the original scale was within standard.
  checkReplacesOriginalInd:
    type: string
    enum: [Y, N]
    description: Whether the check scale replaces the original.
  partialInd:
    type: string
    enum: [Y, N]
    nullable: true
    description: Partial load indicator. Required for SFP; ignored for LT/SLT (server forces Y).
  originalScaleDate:
    type: string
    format: date
    description: Original date of scale (not in the future; on/before chkScaleDate).
  originalScaleReturnNo:
    type: integer
    description: Original scale return number.
  chkScaleDate:
    type: string
    format: date
    description: Check date of scale (not in the future).
  chkScaleReturnNo:
    type: integer
    description: Check scale return number.
  chkScalerCommentTxt:
    type: string
    maxLength: 4000
    nullable: true
    description: Free-text comment by the check scaler.
