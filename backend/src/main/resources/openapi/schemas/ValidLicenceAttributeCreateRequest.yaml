type: object
description: |
  Request body for creating a new valid licence attribute.
  The combination of `scaleGradingSystemCode` + `scalerAppointmentType` must be unique.
  `scalerAppointmentType` is locked after creation.
required:
  - scaleGradingSystemCode
  - scalerAppointmentType
  - effectiveDate
properties:
  scaleGradingSystemCode:
    type: string
    maxLength: 4
    description: Scale grading system code. Part of the primary key.
    example: "BC"
  scalerAppointmentType:
    type: string
    maxLength: 4
    description: Scaler appointment type code. Part of the primary key.
    example: "O"
  effectiveDate:
    type: string
    format: date
    description: Date from which this valid licence attribute is effective.
    example: "2023-01-01"
  expiryDate:
    type: string
    format: date
    nullable: true
    description: Date on which this valid licence attribute expires. Optional.
    example: "2030-12-31"
