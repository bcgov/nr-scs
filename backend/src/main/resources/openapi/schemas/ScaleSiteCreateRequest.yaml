type: object
description: |
  Request payload for creating a new Scale Site. Maps to `scs_scale_site_pkg.create_rec`
  for the parent row, followed by one or more `scs_site_scaling_method_pkg.create_rec`
  inserts (one per entry in `scalingMethods`) within a single transaction.

  Business rules enforced server-side (ported from legacy `ScaleSiteBo.validateCreateScaleSite`):
  * `siteName` required, max 40.
  * `siteLocation` required, max 200.
  * `ownerClientNumber` + `ownerClientLocnCode` required; the client must exist in the
    BC Forests client registry.
  * `orgUnitNo` required.
  * `scalingMethods` must contain at least one entry, with exactly one row using
    `scaleSitePriorityCode` `"P"` (primary). Method codes must be distinct.
  * `timberBrand` is optional; if supplied, must match `[A-Z]{3}.*`, be 6–7 characters,
    and is uppercased before persistence.
  * `latitude` / `longitude` are optional; if any component is supplied, the full
    coordinate must be valid (degrees/minutes/seconds in range).

  The generated `scaleSiteIdNmbr` is returned in the success response and not supplied
  by the caller.
required:
  - siteName
  - ownerClientNumber
  - ownerClientLocnCode
  - orgUnitNo
  - siteLocation
  - scalingMethods
properties:
  siteName:
    type: string
    maxLength: 40
    description: Scale site name.
    example: "MAIN YARD"
  ownerClientNumber:
    type: string
    maxLength: 8
    description: Owner client number from the BC Forests client registry.
    example: "12345678"
  ownerClientLocnCode:
    type: string
    maxLength: 2
    description: Owner client location code.
    example: "00"
  orgUnitNo:
    type: integer
    format: int64
    description: Region / district organization unit number.
    example: 100
  siteLocation:
    type: string
    maxLength: 200
    description: Description of site location.
    example: "Nanaimo, BC"
  timberBrand:
    type: string
    nullable: true
    description: |
      Optional timber brand. If supplied, must match `[A-Z]{3}.*`, be 6–7 characters
      total, and is uppercased before persistence.
    example: "TB-123"
  latitude:
    nullable: true
    description: |
      Optional latitude. If any component is supplied, all three must be supplied
      and form a valid coordinate (degrees -90..90, minutes 0..59, seconds 0..59).
    $ref: '../root.yaml#/components/schemas/Coordinate'
  longitude:
    nullable: true
    description: |
      Optional longitude. If any component is supplied, all three must be supplied
      and form a valid coordinate (degrees -180..180, minutes 0..59, seconds 0..59).
    $ref: '../root.yaml#/components/schemas/Coordinate'
  scalingMethods:
    type: array
    minItems: 1
    description: |
      Scaling-method rows for the new scale site. At least one row is required, and
      exactly one row must carry `scaleSitePriorityCode` `"P"`. Method codes must be
      distinct across the list.
    items:
      $ref: '../root.yaml#/components/schemas/SiteScalingMethodInput'
    example:
      - scaleMethodTypeCode: "W"
        scaleSitePriorityCode: "P"
      - scaleMethodTypeCode: "P"
        scaleSitePriorityCode: "S"
