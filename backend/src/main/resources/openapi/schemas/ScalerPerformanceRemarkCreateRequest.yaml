type: object
description: |
  Request payload for creating a scaler performance-remark record from the scaler Performance
  Remarks tab create page (legacy `scalerPerformanceRemarkCreate.jsp`). Maps to
  `scs_scaler_performanc_rmrk_pkg.insert_rec`.

  This payload is specific to performance-remark maintenance and intentionally excludes
  `scalerLicenceNo` and `scalerPerformanceRemarkId`, which are supplied in the request path /
  generated by the database, and the audit fields, which are set server-side.

  Business rules enforced server-side (mirroring `ScalerPerformanceRemarkBo.validate`):
  * `loggedTimestamp` (Date of Incident) is required and cannot be in the future.
  * Exactly one of `scalerPerformanceActnCode` (Action) or `scalerPerformanceOutcmCode`
    (Outcome) must be supplied — the legacy "Issue Type" is one or the other, never both.
  * `suspendStartDate` must be on or before `suspendEndDate` when both are supplied.
  * `checkScaleId`, when supplied, must reference an existing check scale.
required:
  - loggedTimestamp
  - performanceRemarkDesc
properties:
  loggedTimestamp:
    type: string
    format: date
    description: Date of incident — legacy "Date of Incident" field. Required, cannot be in the future.
    example: "2025-01-10"
  scalerPerformanceActnCode:
    type: string
    maxLength: 4
    nullable: true
    description: |
      Performance action code from the `SCALER_PERFORMANCE_ACTN_CODE` LOV. Supply either this or
      `scalerPerformanceOutcmCode`, never both.
    example: "W"
  scalerPerformanceOutcmCode:
    type: string
    maxLength: 4
    nullable: true
    description: |
      Performance outcome code from the `SCALER_PERFORMANCE_OUTCM_CODE` LOV. Supply either this or
      `scalerPerformanceActnCode`, never both.
    example: "R"
  performanceRemarkDesc:
    type: string
    maxLength: 4000
    description: Free-text remark — legacy "Description" field. Required.
    example: "Late submission of scale data"
  outcomeDesc:
    type: string
    maxLength: 4000
    nullable: true
    description: Free-text outcome description — legacy "Outcome Description" field.
  suspendStartDate:
    type: string
    format: date
    nullable: true
    description: Suspension start date. Must be on or before `suspendEndDate` when both are supplied.
    example: "2025-02-01"
  suspendEndDate:
    type: string
    format: date
    nullable: true
    description: Suspension end date.
    example: "2025-03-01"
  checkScaleId:
    type: integer
    format: int64
    nullable: true
    description: Associated check scale id. When supplied, must reference an existing check scale.
    example: 55001
