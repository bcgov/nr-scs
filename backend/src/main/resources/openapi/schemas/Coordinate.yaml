type: object
description: |
  Geographic coordinate component (latitude or longitude) expressed in degrees,
  minutes, and seconds. Used by the Scale Site create flow for the optional
  latitude/longitude inputs. If any component is supplied, all three must be
  supplied and form a valid coordinate (validated server-side).
required:
  - degrees
  - minutes
  - seconds
properties:
  degrees:
    type: integer
    description: Degrees component. Range -90..90 for latitude, -180..180 for longitude.
    example: 49
  minutes:
    type: integer
    description: Minutes component (0..59).
    example: 10
  seconds:
    type: integer
    description: Seconds component (0..59).
    example: 22
