    description: Scale site inspection list, query, and maintenance operations
  - name: ScalerAppointment
    description: Scaler appointment list and maintenance operations
  - name: ScalerExam
    description: Scaler exam / upgrade (training) list and maintenance operations
  - name: ScalerPerformanceRemark
    description: Scaler performance remark list operations
  - name: ScalerAuthorization
    description: Scaler authorization create and query operations
  - name: ScaleSiteAuthorization
    description: Scale site authorization create and query operations
  - name: ScaleAuthTemplate
    description: Scale auth template maintenance operations
  - name: Welcome
    description: Welcome page data
  - name: SystemSetting
    description: System setting maintenance operations
  - name: SystemStatus
    description: System availability (enable/disable) status
  - name: MarkSiteDesignation
    description: Mark site designation operations
  - name: Workbench
    description: Expiring authorization operations for workbench (renewal of expiring authorizations)
  - name: InspectionQuestion
    description: Inspection question maintenance operations
  - name: Condition
    description: Condition maintenance operations
  - name: AuthorizationClause
    description: Authorization clause maintenance operations
  - name: SignatureBlock
    description: Signature block maintenance operations
  - name: ValidLicenceAttribute
    description: Valid licence attribute maintenance operations
  - name: ExamUpgrade
    description: Exam/upgrade (training type) maintenance operations
  - name: ScaleSiteRiskAssessment
    description: Scale site risk assessment query operations
  - name: AppointmentType
    description: Appointment type maintenance operations
  - name: ScaleSiteContact
    description: Scale site contact management operations
  - name: ScalerRiskAssessment
    description: Scaler risk assessment query operations
  - name: ScaleSiteSoftware
    description: Scale site software query operations

