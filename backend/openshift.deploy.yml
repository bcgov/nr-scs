---
# Backend deploy Template — consumed by `oc process` in reusable-deploy.yml.
#
# Naming follows the quickstart-openshift convention (${NAME}-${ZONE}-backend, label
# app=${NAME}-${ZONE}) so the shared PR-close cleanup and the scheduled PR purge, which select on
# that label, keep working. The Oracle wiring (TCPS trust-store init container, keystore PVC) follows
# the other NRIDS Java apps (e.g. bcgov/nr-cbr).
#
#   ZONE       PR number for previews, 'test' for TEST, 'prod' for PROD.
#   IMAGE_TAG  GHCR tag (PR number or head SHA for previews; merge.yml deploys the PR's tag).
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-scs-backend-deploy
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. PR number, test or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "1"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "2"
  - name: CPU_REQUEST
    value: "200m"
  - name: MEMORY_REQUEST
    value: "500Mi"
  # The JVM sizes its heap as a percentage of this limit (-XX:MaxRAMPercentage=60 in the Dockerfile).
  - name: MEMORY_LIMIT
    value: "1Gi"
  # Container timezone; the JVM default zone and so the log timestamps. Named zones resolve from the
  # tzdb bundled in the JDK, so the Alpine image needs no tzdata package.
  - name: TZ
    value: America/Vancouver
  - name: APP_LOG_LEVEL
    description: Log level for ca.bc.gov.nrs.scs (DEBUG|INFO|WARN|ERROR)
    value: INFO
  # Welcome-page label and the mock-auth guard's input. Never LOCAL or DEV on OpenShift: those are
  # the only values under which SecurityConfig permits mock authentication.
  - name: APP_ENVIRONMENT
    description: DELIVERY (PR previews), TEST or PROD
    required: true
  - name: APP_VERSION
    description: Version shown on the welcome page
    value: "0.0.0"

  # --- Oracle (TCPS, port 1543) ---
  - name: DATABASE_HOST
    required: true
  - name: DATABASE_SERVICE_NAME
    required: true
  - name: DATABASE_USER
    required: true
  - name: DATABASE_PASSWORD
    required: true
  - name: KEYSTORE_SECRET
    description: Passphrase for the Oracle TCPS trust store built by the init container
    required: true

  # --- Authentication (FAM/Cognito JWT validation; replaced by Keycloak in a follow-up) ---
  # Required: with no JWKS URI the backend would fall back to mock auth, which SecurityConfig refuses
  # outside LOCAL/DEV, so the pod would not start. Failing here gives the clearer error.
  - name: JWT_ISSUER_JWKS_URI
    description: https://cognito-idp.<region>.amazonaws.com/<user-pool-id>/.well-known/jwks.json
    required: true
  - name: JWT_AUDIENCE
    description: Expected token audience (the Cognito app client id)
    required: true

  # --- JasperReports Server ---
  - name: JASPER_SERVER_LOGIN_URL
    value: ""
  - name: JASPER_SERVER_FETCH_URL
    value: ""
  - name: JASPER_SERVER_USERNAME
    value: ""
  - name: JASPER_SERVER_PASSWORD
    value: ""

  # --- Email (CHES). Off unless MAIL_ENABLED=true, which then requires the URLs and credentials. ---
  - name: MAIL_ENABLED
    value: "false"
  - name: CHES_EMAIL_URL
    value: ""
  - name: CHES_TOKEN_URL
    value: ""
  - name: CHES_CLIENT_ID
    value: ""
  - name: CHES_CLIENT_SECRET
    value: ""
  - name: CHES_FROM_EMAIL
    value: ""

objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      replicas: ${{MIN_REPLICAS}}
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
          annotations:
            prometheus.io/path: /actuator/prometheus
            prometheus.io/port: "8080"
            prometheus.io/scrape: "true"
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          initContainers:
            # Fetches the Oracle listener's certificate and writes a JKS trust store to /cert
            # (jssecacerts), protected by KEYSTORE_SECRET. Shared image used by the NRIDS Java apps.
            - name: ${NAME}-${COMPONENT}-init
              image: ghcr.io/bcgov/nr-forest-client/common:prod
              imagePullPolicy: Always
              env:
                - name: ORACLEDB_HOST
                  value: ${DATABASE_HOST}
                - name: ORACLEDB_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: KEYSTORE_SECRET
                - name: ORACLEDB_PORT
                  value: "1543"
              volumeMounts:
                - name: api-cert
                  mountPath: /cert
                - name: init-tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "100m"
                  memory: "200Mi"
                  ephemeral-storage: "50Mi"
                limits:
                  cpu: "500m"
                  memory: "500Mi"
                  ephemeral-storage: "100Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              env:
                - name: TZ
                  value: ${TZ}
                - name: SERVER_PORT
                  value: "8080"
                - name: APP_ENVIRONMENT
                  value: ${APP_ENVIRONMENT}
                - name: APP_VERSION
                  value: ${APP_VERSION}
                - name: APP_SERVER_NAME
                  value: ${NAME}-${ZONE}
                - name: APP_LOG_LEVEL
                  value: ${APP_LOG_LEVEL}
                - name: SECURITY_JWT_ENABLED
                  value: "true"
                - name: JWT_ISSUER_JWKS_URI
                  value: ${JWT_ISSUER_JWKS_URI}
                - name: JWT_AUDIENCE
                  value: ${JWT_AUDIENCE}
                - name: DATABASE_HOST
                  value: ${DATABASE_HOST}
                - name: DATABASE_SERVICE_NAME
                  value: ${DATABASE_SERVICE_NAME}
                - name: DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: DATABASE_USER
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: DATABASE_PASSWORD
                - name: KEYSTORE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: KEYSTORE_SECRET
                - name: JASPER_SERVER_LOGIN_URL
                  value: ${JASPER_SERVER_LOGIN_URL}
                - name: JASPER_SERVER_FETCH_URL
                  value: ${JASPER_SERVER_FETCH_URL}
                - name: JASPER_SERVER_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: JASPER_SERVER_USERNAME
                - name: JASPER_SERVER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: JASPER_SERVER_PASSWORD
                - name: MAIL_ENABLED
                  value: ${MAIL_ENABLED}
                - name: CHES_EMAIL_URL
                  value: ${CHES_EMAIL_URL}
                - name: CHES_TOKEN_URL
                  value: ${CHES_TOKEN_URL}
                - name: CHES_FROM_EMAIL
                  value: ${CHES_FROM_EMAIL}
                - name: CHES_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: CHES_CLIENT_ID
                - name: CHES_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: CHES_CLIENT_SECRET
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                  ephemeral-storage: "500Mi"
                limits:
                  memory: ${MEMORY_LIMIT}
                  ephemeral-storage: "1Gi"
              # Liveness and readiness use Boot's probe groups, not /actuator/health: the overall
              # status includes the database, and a DB outage should not restart every pod.
              startupProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
              volumeMounts:
                - name: api-cert
                  mountPath: /cert
                - name: logs
                  mountPath: /logs
                # Heap dumps on OOM (-XX:HeapDumpPath=/temp in the Dockerfile).
                - name: heap-dumps
                  mountPath: /temp
                # Load-bearing under readOnlyRootFilesystem: the JVM's temp dir, multipart spool and
                # fontconfig cache (HOME=/tmp in the Dockerfile).
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: api-cert
              persistentVolumeClaim:
                claimName: ${NAME}-${ZONE}-${COMPONENT}-api-cert
            - name: logs
              emptyDir: {}
            - name: heap-dumps
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: init-tmp
              emptyDir: {}

  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 8080
          protocol: TCP
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}

  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 200

  # Oracle trust store written by the init container; one per zone so PR previews get their own.
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}-api-cert
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 50Mi
      storageClassName: netapp-file-standard

  - apiVersion: v1
    kind: Secret
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    type: Opaque
    stringData:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KEYSTORE_SECRET: ${KEYSTORE_SECRET}
      JASPER_SERVER_USERNAME: ${JASPER_SERVER_USERNAME}
      JASPER_SERVER_PASSWORD: ${JASPER_SERVER_PASSWORD}
      CHES_CLIENT_ID: ${CHES_CLIENT_ID}
      CHES_CLIENT_SECRET: ${CHES_CLIENT_SECRET}

  # Ingress: same-zone frontend (Caddy proxies /api) and cluster monitoring (Prometheus scrape).
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}-ingress
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-frontend
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: monitoring
      policyTypes:
        - Ingress

  # Egress: explicit permit-all (Oracle, JasperReports Server, CHES, FAM/Cognito JWKS). Documents
  # intent; it does not restrict anything the namespace default allows.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}-egress
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      egress:
        - {}
      policyTypes:
        - Egress
