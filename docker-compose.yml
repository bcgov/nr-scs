# Local container run of the SCS stack: the same images CI builds and OpenShift runs.
#
# Oracle is not part of this file: SCS uses the shared ministry database. Point the backend at one
# in backend/.env (copy backend/.env.example), e.g. the seeded E2E container from
# frontend/e2e/README.md at jdbc:oracle:thin:@//host.docker.internal:1525/DBDOCK_01.
#
# Day-to-day development is still `mvn spring-boot:run` (backend) + `npm start` (frontend, Vite on
# :3000 with mock auth); see README.md. The frontend image is a production build, so it signs in
# through BC Gov SSO (Keycloak) and cannot use the mock user. To sign in locally, register
# http://localhost:3000/authCallback on the CSS integration and set the two KEYCLOAK values below
# (and KEYCLOAK_ISSUER_URI / KEYCLOAK_CLIENT_ID in backend/.env).
services:
  backend:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      SERVER_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      LOG_LEVEL: info
      VITE_KEYCLOAK_URL: ${KEYCLOAK_ISSUER_URI:-}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      VITE_ZONE: dev
    ports:
      - "3000:3000"
